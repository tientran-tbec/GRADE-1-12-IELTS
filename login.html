<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập – GRADE 1-12-IELTS</title><link rel="stylesheet" href="engine/app.css?v=1790904312">
<script>window.GN_URL="https://script.google.com/macros/s/AKfycbyZ4UJgI763vPb4TZhKbKgxl6p-lGCQCJnZDqgCL9mHCVQpUzb4sbJGg89GLWSI-sQj/exec";window.GN_ROOT="";</script><script src="engine/auth.js?v=1790904312"></script></head><body>
<div class="login">
 <div class="card" id="fLogin">
  <h1>GRADE 1-12-IELTS</h1><p class="mut" style="margin-top:-6px">Đăng nhập</p><p class="mut">Dùng tài khoản do giáo viên cấp.</p>
  <form id="lf" autocomplete="on">
   <label>Tên đăng nhập<input id="u" autocomplete="username" autocapitalize="off" required></label>
   <label>Mật khẩu<input id="p" type="password" autocomplete="current-password" required></label>
   <div class="err" id="e1"></div>
   <button class="btn" id="b1" style="width:100%">Đăng nhập</button>
  </form>
  <p class="mut" style="margin-top:14px;font-size:13px">Quên mật khẩu? Hãy nhờ giáo viên đặt lại.</p>
 </div>
 <div class="card" id="fChange" hidden>
  <h1>Đổi mật khẩu</h1><p class="mut" id="chMsg">Hãy đặt mật khẩu mới (ít nhất 6 ký tự).</p>
  <form id="cf">
   <label>Mật khẩu hiện tại<input id="op" type="password" autocomplete="current-password" required></label>
   <label>Mật khẩu mới<input id="np" type="password" autocomplete="new-password" minlength="6" required></label>
   <label>Nhập lại mật khẩu mới<input id="np2" type="password" autocomplete="new-password" minlength="6" required></label>
   <div class="err" id="e2"></div>
   <button class="btn" id="b2" style="width:100%">Lưu mật khẩu</button>
   <p style="text-align:center"><a href="#" id="skip">Để sau</a></p>
  </form>
 </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var qs=new URLSearchParams(location.search), next=qs.get('next')||'';
if(qs.get('msg')){$('e1').textContent=qs.get('msg')}
function dest(){
  var u=GNAuth.user();
  if(next){try{var n=new URL(next,location.href);if(n.origin===location.origin&&n.href.indexOf('login.html')<0)return n.href}catch(e){}}
  return (u&&(u.role==='admin'||u.role==='teacher'))?'admin.html':'index.html';
}
function showChange(force){
  $('fLogin').hidden=true;$('fChange').hidden=false;
  $('skip').parentNode.hidden=!!force;
  if(force)$('chMsg').textContent='Đây là lần đăng nhập đầu (hoặc mật khẩu vừa được đặt lại). Hãy đặt mật khẩu mới – ít nhất 6 ký tự.';
}
var s=GNAuth.get();
if(s&&qs.get('change')){showChange(s.user.mustChange)}
else if(s&&!s.user.mustChange){location.replace(dest())}
else if(s&&s.user.mustChange){showChange(true)}
$('lf').onsubmit=function(e){
  e.preventDefault();$('e1').textContent='';$('b1').disabled=true;$('b1').textContent='Đang đăng nhập…';
  GNAuth.api('auth_login',{username:$('u').value.trim(),password:$('p').value}).then(function(j){
    GNAuth.set(j.token,j.user);
    if(j.user.mustChange){$('op').value=$('p').value;showChange(true)}else location.replace(dest());
  }).catch(function(err){$('e1').textContent=err.server?err.message:'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'})
  .then(function(){$('b1').disabled=false;$('b1').textContent='Đăng nhập'});
};
$('cf').onsubmit=function(e){
  e.preventDefault();$('e2').textContent='';
  if($('np').value!==$('np2').value){$('e2').textContent='Hai mật khẩu mới không giống nhau.';return}
  $('b2').disabled=true;
  GNAuth.api('auth_change_password',{old_password:$('op').value,new_password:$('np').value}).then(function(){
    var s=GNAuth.get();s.user.mustChange=false;GNAuth.set(s.token,s.user);location.replace(dest());
  }).catch(function(err){$('e2').textContent=err.server?err.message:'Không kết nối được máy chủ.'}).then(function(){$('b2').disabled=false});
};
$('skip').onclick=function(e){e.preventDefault();location.replace(dest())};
})();
</script></body></html>
